<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breanna Gordon: Projects</title>
<meta name="description" content="Interactive projects by Breanna Gordon: hand-tracked drawing, sensor-driven escape rooms, particles, games and more. Most run right in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E2A33;--grid:#173F4B;--sand:#F2E3C6;--paper:#FBF3E0;--ink:#0E2A33;--coral:#FF7F6B;--sky:#9FD8E8;--sun:#FFD23F;--mint:#8DE3C2;--rose:#FF8FB1;--soft:#A9BDBB;
--d:'Bricolage Grotesque',sans-serif;--h:'Caveat',cursive;--b:'Hanken Grotesk',sans-serif;--mx:50vw;--my:40vh}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:36px 36px;color:var(--sand);font-family:var(--b);font-size:16px;line-height:1.5}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
/* spotlight: the wall is dim, the cursor lights it */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;background:radial-gradient(circle 420px at var(--mx) var(--my),rgba(255,226,140,.10) 0,rgba(255,226,140,.04) 22%,transparent 42%,rgba(4,16,20,.5) 72%,rgba(4,16,20,.8) 100%)}
body.nolight::after{display:none}
.hero{position:relative;min-height:94vh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 clamp(18px,4vw,56px) clamp(28px,6vh,60px);overflow:hidden;isolation:isolate}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;z-index:-1}
.hero h1{font-family:var(--d);font-weight:800;font-size:clamp(56px,15.5vw,250px);line-height:.84;letter-spacing:-.045em;margin:0}
.hero h1 span{display:block}.hero h1 span+span{padding-left:.9em}
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap;margin-top:clamp(22px,4vh,44px)}
.intro p{max-width:44ch;margin:0;font-size:clamp(17px,1.5vw,20px)}
.cue{font-family:var(--h);font-size:26px;color:var(--sun);transform:rotate(-2deg)}
.bar{position:sticky;top:0;z-index:70;background:rgba(14,42,51,.92);backdrop-filter:blur(6px);border-bottom:1px solid #2C5560;padding:12px clamp(18px,4vw,56px);display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.bar b{font-family:var(--d);font-weight:800;font-size:20px;letter-spacing:-.02em;margin-right:auto}
.bar button{font:inherit;font-weight:600;font-size:14px;color:var(--ink);background:var(--paper);border:0;padding:5px 14px;cursor:pointer;transform:rotate(var(--r,-1deg));position:relative}
.bar button:nth-child(even){--r:1.2deg}.bar button:nth-child(3n){--r:-.4deg}
.bar button::before{content:"";position:absolute;top:-6px;left:50%;width:30px;height:11px;margin-left:-15px;background:var(--tape,var(--sun));opacity:.85;transform:rotate(-4deg)}
.bar button:nth-child(3n+1){--tape:var(--rose)}.bar button:nth-child(3n+2){--tape:var(--mint)}
.bar button[aria-pressed=true]{background:var(--sun)}
.board{display:flex;flex-wrap:wrap;gap:clamp(34px,4.5vw,64px);justify-content:center;padding:clamp(40px,5vw,72px) clamp(14px,4vw,56px) 120px}
.print{position:relative;width:min(100%,390px);background:var(--paper);color:var(--ink);padding:14px 14px 18px;box-shadow:0 2px 0 rgba(0,0,0,.08),0 18px 30px -12px rgba(0,0,0,.6);transform:rotate(var(--r));transition:transform .3s,box-shadow .3s}
.print.wide{width:min(100%,520px)}
.print[hidden]{display:none}
.print:hover,.print:focus-within{transform:rotate(0) scale(1.035);z-index:5;box-shadow:0 26px 40px -14px rgba(0,0,0,.75)}
.print::before{content:"";position:absolute;top:-15px;left:50%;width:100px;height:30px;margin-left:-50px;background:var(--tape);opacity:.88;transform:rotate(var(--tr,-3deg));box-shadow:0 1px 2px rgba(0,0,0,.15)}
.t0{--tape:var(--sun)}.t1{--tape:var(--rose)}.t2{--tape:var(--mint)}.t3{--tape:var(--sky)}
.shot{position:relative;aspect-ratio:4/3;background:#fff;overflow:hidden}
.wide .shot{aspect-ratio:16/10}
.shot iframe{position:absolute;top:0;left:0;width:200%;height:200%;border:0;transform:scale(.5);transform-origin:0 0;pointer-events:none}
.shot.on iframe{pointer-events:auto}
.shot.live{cursor:pointer}
.hint{position:absolute;right:8px;bottom:8px;background:var(--ink);color:var(--sand);font-size:12px;padding:2px 9px;pointer-events:none}.shot.on .hint{display:none}
.shot.none{display:grid;place-items:center;font-family:var(--d);font-weight:800;font-size:68px;letter-spacing:-.05em;background:var(--c1);color:var(--ink)}
.f0{--c1:var(--sky)}.f1{--c1:var(--coral)}.f2{--c1:var(--mint)}.f3{--c1:var(--rose)}
h3{font-family:var(--h);font-weight:700;font-size:36px;line-height:1;margin:12px 0 4px}
.print p{margin:0 0 8px;font-size:14.5px}
.meta{color:#5B6F73;font-size:13px}
.links{display:flex;flex-wrap:wrap;gap:4px 14px;font-weight:600;font-size:14px}
.links a{color:var(--ink);text-decoration-color:var(--coral);text-decoration-thickness:2px;text-underline-offset:3px}.links a.sec{font-weight:400;color:#4B6165}
footer{text-align:center;padding:0 20px 60px;color:var(--soft);font-size:15px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.print,.bar button{transition:none}}
</style></head><body>
<header class="hero"><canvas id="c1" aria-hidden="true"></canvas><canvas id="c2" aria-hidden="true"></canvas>
<h1><span>Breanna</span><span>Gordon</span></h1>
<div class="intro"><p>Computer science student making things you can touch in the browser: hand-tracked drawing, rooms that read real sensors, particles, games and more.</p><span class="cue">draw on the wall, then scroll</span></div></header>
<nav class="bar" aria-label="Filter projects"><b>Projects</b></nav>
<main class="board" id="board"></main>
<footer>Projects all made by Breanna Gordon</footer>
<script>const ITEMS=[{"title": "Room404", "desc": "Group IoT escape room built around real building sensors at UAL High Holborn. Players solve puzzles on a phone while a live dashboard reads the room.", "tags": "javascript iot", "iframe": "https://breanna-gordon.github.io/Room404/dashboard.html", "links": [["Dashboard", "https://breanna-gordon.github.io/Room404/dashboard.html", 1], ["Player", "https://breanna-gordon.github.io/Room404/player.html", 1], ["Canvas", "https://breanna-gordon.github.io/Room404/index.html", 1], ["Code", "https://github.com/Breanna-Gordon/Room404", 0]]}, {"title": "Motion Canvas", "desc": "A p5.js drawing tool using Leap Motion hand tracking. It reframes hand tremor as expressive drawing texture, and works with a mouse if the hardware isn't connected.", "tags": "javascript iot", "iframe": "https://breanna-gordon.github.io/Motion-Canvas/code/iteration3/index.html", "links": [["Live demo", "https://breanna-gordon.github.io/Motion-Canvas/code/iteration3/index.html", 1], ["Concept demo", "https://breanna-gordon.github.io/Motion-Canvas/code/demos/tremor-comparison.html", 1], ["Full write-up", "https://breanna-gordon.github.io/Motion-Canvas/", 0], ["Code", "https://github.com/Breanna-Gordon/Motion-Canvas", 0]]}, {"title": "Particle Explorer", "desc": "Mathematical curves visualised as interactive 3D particles. A WebGL piece that explores parametric equations with particle systems and real-time audio synthesis.", "tags": "javascript", "iframe": "https://breanna-gordon.github.io/Particle-Explorer/", "links": [["Live demo", "https://breanna-gordon.github.io/Particle-Explorer/", 1], ["Code", "https://github.com/Breanna-Gordon/Particle-Explorer", 0]]}, {"title": "Chess", "desc": "A chess engine in vanilla JavaScript with a minimax AI, alpha-beta pruning and a local two-player mode.", "tags": "javascript", "iframe": "https://breanna-gordon.github.io/chess/chess-engine/index.html", "links": [["Live demo", "https://breanna-gordon.github.io/chess/chess-engine/index.html", 1], ["Code", "https://github.com/Breanna-Gordon/chess", 0]]}, {"title": "BeatByte", "desc": "A website about game audio, built in HTML and CSS with the user experience in mind.", "tags": "web", "iframe": "https://breanna-gordon.github.io/BeatByte/pages/home.html", "links": [["Live demo", "https://breanna-gordon.github.io/BeatByte/pages/home.html", 1], ["Code", "https://github.com/Breanna-Gordon/BeatByte", 0]]}, {"title": "IoT", "desc": "An ESP32 microcontroller monitors temperature, humidity and heart rate and sends the data to an MQTT broker. A web dashboard shows it and controls an LED and a buzzer. The hardware and server are no longer running, so the dashboard has no live data.", "tags": "python iot", "iframe": "https://breanna-gordon.github.io/IoT/web_dashboard/index.html", "links": [["Live demo", "https://breanna-gordon.github.io/IoT/web_dashboard/index.html", 1], ["Read me", "https://breanna-gordon.github.io/IoT", 0], ["Code", "https://github.com/Breanna-Gordon/IoT", 0]]}, {"title": "Algorithms", "desc": "Algorithm exercises, with a web page to explore them.", "tags": "web", "iframe": "https://breanna-gordon.github.io/algorithms/", "links": [["Live demo", "https://breanna-gordon.github.io/algorithms/", 1], ["Code", "https://github.com/Breanna-Gordon/algorithms", 0]]}, {"title": "ABKA", "desc": "A website built with HTML and CSS.", "tags": "web", "iframe": "https://breanna-gordon.github.io/ABKA/", "links": [["Live demo", "https://breanna-gordon.github.io/ABKA/", 1], ["Code", "https://github.com/Breanna-Gordon/ABKA", 0]]}, {"title": "Pet Sim Practice", "desc": "A virtual pet game made to practise JavaScript.", "tags": "javascript", "iframe": "https://breanna-gordon.github.io/pet-sim-practice/", "links": [["Live demo", "https://breanna-gordon.github.io/pet-sim-practice/", 1], ["Code", "https://github.com/Breanna-Gordon/pet-sim-practice", 0]]}, {"title": "API Practice", "desc": "A web page that fetches and displays data from an external API.", "tags": "web", "iframe": "https://breanna-gordon.github.io/API_Practice/", "links": [["Live demo", "https://breanna-gordon.github.io/API_Practice/", 1], ["Code", "https://github.com/Breanna-Gordon/API_Practice", 0]]}, {"title": "LifeForge", "desc": "A life simulator in Pygame. Build an avatar, then age up through school, work, relationships and family, with choices that change your stats.", "tags": "python", "iframe": null, "links": [["Code", "https://github.com/Breanna-Gordon/LifeForge", 0]]}, {"title": "Orbital System", "desc": "A Unity project with custom shaders, simulating orbiting bodies.", "tags": "unity", "iframe": null, "links": [["Code", "https://github.com/Breanna-Gordon/Orbital-System", 0]]}, {"title": "Global Perspectives Blogs", "desc": "A blog built with Astro.", "tags": "web", "iframe": null, "links": [["Code", "https://github.com/Breanna-Gordon/global_perspectives_blogs", 0]]}];
const FILTERS=[["all","All"],["javascript","JavaScript"],["python","Python"],["unity","Unity"],["iot","IoT and hardware"],["web","Web and other"]];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const match=(it,k)=>k==="all"||it.tags.split(" ").includes(k);
const linksHtml=it=>it.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener"${l[2]?"":' class="sec"'}>${l[0]}</a>`).join("");
const status=it=>it.iframe?"Runs in the browser":"Code only for now";
const LIVE=ITEMS.filter(i=>i.iframe).length;
function lazy(root,rootEl){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.querySelectorAll("iframe[data-src]").forEach(f=>{if(!f.src)f.src=f.dataset.src});io.unobserve(e.target)}}),{rootMargin:"400px",root:rootEl||null});(root.children?[...root.children]:[root]).forEach(c=>io.observe(c))}
function loadFrames(el){el.querySelectorAll("iframe[data-src]").forEach(f=>{if(!f.src)f.src=f.dataset.src})}
function mkFilters(nav,cb,cls){FILTERS.forEach((f,i)=>{const b=document.createElement("button");b.textContent=f[1];b.setAttribute("aria-pressed",i==0);b.onclick=()=>{[...nav.children].forEach(x=>x.setAttribute("aria-pressed",false));b.setAttribute("aria-pressed",true);cb(f[0])};nav.append(b)})}
function playable(el){el.addEventListener("click",()=>el.classList.toggle("on"))}
const frame=(it,cls)=>`<iframe data-src="${it.iframe}" title="${esc(it.title)} preview"></iframe>`;

const board=document.getElementById("board"),tapes=["t0","t1","t2","t3"],fills=["f0","f1","f2","f3"];
ITEMS.forEach((it,i)=>{const d=document.createElement("article");d.className="print "+tapes[(i*3+1)%4]+(i<2?" wide":"");d.style.setProperty("--r",(((i*37)%9)-4)*.7+"deg");d.style.setProperty("--tr",(((i*5)%7)-3)+"deg");
d.innerHTML=`<div class="shot ${it.iframe?"live":"none "+fills[i%4]}">${it.iframe?frame(it)+'<span class="hint">click to play</span>':esc(it.title.slice(0,2))}</div><h3>${esc(it.title)}</h3><p>${esc(it.desc)}</p><p class="meta">${status(it)}</p><div class="links">${linksHtml(it)}</div>`;
if(it.iframe)playable(d.querySelector(".shot"));board.append(d)});
lazy(board);
mkFilters(document.querySelector(".bar"),f=>[...board.children].forEach((d,i)=>d.hidden=!match(ITEMS[i],f)));
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches,touch=matchMedia("(hover:none)").matches;
/* spotlight follows the cursor */
if(reduce||touch)document.body.classList.add("nolight");else addEventListener("pointermove",e=>{document.body.style.setProperty("--mx",e.clientX+"px");document.body.style.setProperty("--my",e.clientY+"px")});
/* hero: two inks overprint (screen blend on the dark wall) */
(function(){const hero=document.querySelector(".hero");
const L=[{c:document.getElementById("c1"),col:"255,127,107",off:0},{c:document.getElementById("c2"),col:"159,216,232",off:14}];let W,H;
function size(){const dpr=Math.min(devicePixelRatio||1,2);W=hero.clientWidth;H=hero.clientHeight;L.forEach(l=>{l.c.width=W*dpr;l.c.height=H*dpr;l.x=l.c.getContext("2d");l.x.setTransform(dpr,0,0,dpr,0,0)});seed()}
function dab(l,x,y,r,a){const g=l.x;g.fillStyle=`rgba(${l.col},${a})`;g.beginPath();g.arc(x+l.off,y+l.off*.6,r,0,6.2832);g.fill()}
function stroke(x0,y0,x1,y1,r){const d=Math.hypot(x1-x0,y1-y0),n=Math.max(1,Math.ceil(d/(r*.4)));for(let i=0;i<=n;i++){const t=i/n,x=x0+(x1-x0)*t,y=y0+(y1-y0)*t;dab(L[0],x,y,r,.5);dab(L[1],x+r*.5,y-r*.3,r*.8,.5)}}
function seed(){L.forEach(l=>l.x.clearRect(0,0,W,H));const s=Math.min(W,H);dab(L[0],W*.74,H*.3,s*.26,.7);dab(L[1],W*.84,H*.42,s*.2,.7);dab(L[1],W*.16,H*.12,s*.08,.7)}
size();addEventListener("resize",size);if(reduce)return;
let px=null,py=null,idle=true,last=0,ax=null,ay=null;const t0=performance.now();
hero.addEventListener("pointermove",e=>{const r=hero.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;idle=false;last=performance.now();if(px!==null)stroke(px,py,x,y,10+Math.min(26,Math.hypot(x-px,y-py)*.5));px=x;py=y});
hero.addEventListener("pointerleave",()=>px=null);
(function f(now){if(now-last>2500)idle=true;
if(idle){const t=(now-t0)/1000,x=W*(.5+.38*Math.sin(t*.37)),y=H*(.38+.3*Math.sin(t*.53+1.3));if(ax!==null)stroke(ax,ay,x,y,14);ax=x;ay=y}else ax=null;
L.forEach(l=>{l.x.globalCompositeOperation="destination-out";l.x.fillStyle="rgba(0,0,0,.012)";l.x.fillRect(0,0,W,H);l.x.globalCompositeOperation="source-over"});requestAnimationFrame(f)})(performance.now());
})();
</script></body></html>
